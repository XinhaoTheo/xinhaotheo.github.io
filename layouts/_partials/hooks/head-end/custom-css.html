<style>
  /* Education cards (resume-biography-3): cap at 2 columns on larger screens.
     With only 2 entries, the theme's xl:grid-cols-3 left an empty third
     column and shrank each card to ~1/3 width, forcing degree names to wrap
     awkwardly. Limiting to 2 columns widens each card. */
  @media (min-width: 768px) {
    .resume-biography .grid.md\:grid-cols-2.xl\:grid-cols-3 {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }
</style>
